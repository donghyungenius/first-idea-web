<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="오늘도 힘내세요! - 당신의 하루를 응원합니다.">
    <title>오늘도 힘내세요!</title>
    <!-- Pretendard & Plus Jakarta Sans 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="noise-overlay"></div>

    <main class="center-container" id="interactive-card">
        <div class="card-inner">
            <span class="badge">Cheer Up</span>
            <h1 class="main-heading" id="main-title">오늘도 힘내세요!</h1>
            <p class="sub-text">당신의 모든 순간과 빛나는 오늘 하루를 진심으로 응원합니다.</p>
        </div>
    </main>

    <footer class="footer-note">
        <span>Click or move cursor to interact</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
